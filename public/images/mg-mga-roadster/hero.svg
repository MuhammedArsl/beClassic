<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Hero — Fahrzeug im Abendlicht">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#25221D" />
      <stop offset="52%" stop-color="#1A1815" />
      <stop offset="100%" stop-color="#0E0D0B" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)" />
  <rect width="1920" height="1080" fill="url(#glow)" />

  <!-- Horizontlinie für Tiefe -->
  <line x1="0" y1="777.6" x2="1920" y2="777.6"
        stroke="#D9C7A6" stroke-width="1" opacity="0.1" />

  <g transform="translate(364.79999999999995 426.24) scale(1.4880000000000002)"
     color="#D9C7A6" opacity="0.2">
    
  <path d="M18 198 L18 168 Q22 140 58 131 L152 118 Q262 104 322 102
           L362 98 Q382 58 432 53 L472 53 Q502 56 512 74 L562 84
           Q642 94 702 119 Q752 134 772 164 L777 198 Z"
        fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linejoin="round" />
  <path d="M372 96 Q392 62 434 58 L470 58 Q494 61 504 76"
        fill="none" stroke="currentColor" stroke-width="1.6" />
  <circle cx="156" cy="198" r="52" fill="none" stroke="currentColor" stroke-width="2.2" />
  <circle cx="156" cy="198" r="24" fill="none" stroke="currentColor" stroke-width="1.2" />
  <circle cx="652" cy="198" r="52" fill="none" stroke="currentColor" stroke-width="2.2" />
  <circle cx="652" cy="198" r="24" fill="none" stroke="currentColor" stroke-width="1.2" />
  <line x1="18" y1="198" x2="790" y2="198" stroke="currentColor" stroke-width="1" opacity="0.5" />

  </g>

  <!-- Feines Korn, damit die Fläche nicht digital flach wirkt -->
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.05" />

  <!-- Hinweis, welches Motiv hier hingehört -->
  <text x="86" y="1021"
        font-family="Helvetica, Arial, sans-serif" font-size="20"
        letter-spacing="4"
        fill="#F7F4EE" opacity="0.4">HERO — FAHRZEUG IM ABENDLICHT</text>
</svg>
